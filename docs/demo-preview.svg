    <rect x="142" y="226" width="110" height="28" rx="14" fill="#24483f"/><text x="197" y="245" text-anchor="middle">Spring Boot</text>
    <rect x="260" y="226" width="110" height="28" rx="14" fill="#24483f"/><text x="315" y="245" text-anchor="middle">PostgreSQL</text>
    <rect x="378" y="226" width="58" height="28" rx="14" fill="#24483f"/><text x="407" y="245" text-anchor="middle">JWT</text>
  </g>
