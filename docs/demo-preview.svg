    <path d="M22 12 L38 20 L22 28 L6 20 Z M12 24 V31 C12 34 32 34 32 31 V24" fill="none" stroke="#1f5e4a" stroke-width="3" stroke-linejoin="round"/>
    <text x="58" y="31" font-size="26" font-weight="700" fill="#ffffff">UniHub</text>
  </g>
  <text x="56" y="164" font-size="38" font-weight="700" fill="#ffffff">University life, organised.</text>
  <text x="56" y="200" font-size="18" fill="#a9c7bc">Courses, assignments, deadlines and schedules in one place</text>
