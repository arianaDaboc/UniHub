      <stop offset="0" stop-color="#0f1f24"/>
      <stop offset="1" stop-color="#173a32"/>
    </linearGradient>
  </defs>
  <rect width="880" height="300" rx="18" fill="url(#bg)"/>
  <g transform="translate(56 64)">
