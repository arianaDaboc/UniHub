<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniHub Demo</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #101d22; color: #fff; font-family: Arial, sans-serif; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(1200px, 100%); }
    h1 { margin: 0 0 16px; font-size: 24px; letter-spacing: 0; }
    #unmute { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 999px; background: #2f7a5f; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    video { display: block; width: 100%; max-height: calc(100vh - 96px); background: #000; }
  </style>
</head>
<body>
  <main>
    <h1>UniHub application demo</h1>
    <video id="demo" controls autoplay playsinline preload="auto">
      <source src="https://github.com/arianaDaboc/UniHub/releases/download/demo-v1/unihub_video_compressed.mp4" type="video/mp4">
      Your browser does not support MP4 video playback.
    </video>
    <button id="unmute" type="button" hidden>🔊 Turn on sound</button>
  </main>
  <script>
    // Start the video as soon as the page opens. Browsers block autoplay with sound,
    // so fall back to muted playback and show a button to turn the sound on.
    (function () {
      var video = document.getElementById('demo');
      var btn = document.getElementById('unmute');
      function showUnmute() { btn.hidden = false; }
      btn.addEventListener('click', function () { video.muted = false; video.play(); btn.hidden = true; });
      video.addEventListener('volumechange', function () { if (!video.muted) btn.hidden = true; });
      var attempt = video.play();
      if (attempt && attempt.catch) {
        attempt.catch(function () { video.muted = true; video.play().then(showUnmute).catch(function () {}); });
      }
    })();
  </script>
</body>
</html>
